name: Deploy to EC2 Server

on:
  push:
    branches:
      - development
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into EC2 and update code
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /var/www/parkchung
            # Reset any local changes just in case
            git reset --hard HEAD
            # Update the code
            git pull origin ${{ github.ref_name }}
            # Install any new dependencies
            cd server && npm install --production
            cd ..
            
            # Diagnostic outputs
            mkdir -p server/public client
            echo "=== PM2 Status ===" > server/public/pm2-status.txt
            pm2 status >> server/public/pm2-status.txt 2>&1
            echo "=== PM2 list ===" >> server/public/pm2-status.txt
            pm2 list >> server/public/pm2-status.txt 2>&1
            echo "=== Systemctl Node ===" >> server/public/pm2-status.txt
            systemctl list-units --type=service | grep -i -E "node|park" >> server/public/pm2-status.txt 2>&1
            echo "=== Processes ===" >> server/public/pm2-status.txt
            ps aux | grep -E "node|pm2|server.js" >> server/public/pm2-status.txt 2>&1
            echo "=== Netstat ===" >> server/public/pm2-status.txt
            netstat -tulpn >> server/public/pm2-status.txt 2>&1
            cp server/public/pm2-status.txt client/pm2-status.txt
            
            # Restart server to apply new code (try both PM2 and Systemctl depending on what's active)
            pm2 reload all --update-env || pm2 restart all || sudo systemctl restart parkchung || sudo systemctl restart parkchung-server || echo "Could not restart automatically"
            
            echo "Deployment completed successfully!"
