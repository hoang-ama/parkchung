<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookings | Parkchung</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Reset & Base */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Montserrat", sans-serif;
            background: linear-gradient(135deg, #13b47e 0%, #1f6f35 100%);
            min-height: 100vh;
            color: #333;
            line-height: 1.5;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* Layout Utilities */
        .container {
            max-width: 1140px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Header */
        header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            padding: 15px 0;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-area {
            display: flex;
            flex-direction: column;
        }

        .logo-text {
            font-size: 24px;
            font-weight: 700;
            color: #13b47e;
            letter-spacing: 1px;
            transition: color 0.3s ease;
        }

        .logo-text:hover {
            color: #1f6f35;
        }

        .logo-slogan {
            font-size: 12px;
            color: #777;
            margin-top: 2px;
        }

        .nav-menu {
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .nav-item {
            font-size: 15px;
            font-weight: 500;
            color: #555;
            transition: all 0.3s ease;
            padding: 8px 16px;
            border-radius: 20px;
        }

        .nav-item:hover {
            color: #13b47e;
            background: rgba(19, 180, 126, 0.1);
        }

        .nav-item.active {
            color: #ffffff;
            background: linear-gradient(135deg, #13b47e 0%, #1f6f35 100%);
            font-weight: 700;
            box-shadow: 0 4px 15px rgba(19, 180, 126, 0.3);
        }

        /* Page Title Section */
        .page-title-section {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 30px 0;
            margin-bottom: 40px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .page-title-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .page-title {
            font-size: 32px;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        .back-link {
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 24px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .back-link:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.5);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        /* Booking List */
        .booking-list {
            display: flex;
            flex-direction: column;
            gap: 25px;
            padding-bottom: 60px;
        }

        /* Booking Card */
        .booking-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            display: flex;
            overflow: hidden;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.3);
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .booking-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.2);
        }

        /* Left Column: Icon */
        .card-icon-col {
            width: 100px;
            background: linear-gradient(135deg, #13b47e 0%, #1f6f35 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }

        .card-icon-col::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.2) 0%, transparent 70%);
            animation: pulse 3s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(0.8);
                opacity: 0.5;
            }

            50% {
                transform: scale(1.2);
                opacity: 0.8;
            }
        }

        .parking-icon {
            color: #fff;
            font-size: 40px;
            font-weight: 700;
            border: 3px solid #fff;
            width: 60px;
            height: 60px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            z-index: 1;
        }

        /* Right Column: Details */
        .card-details-col {
            flex-grow: 1;
            padding: 30px;
        }

        .parking-name {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, #13b47e 0%, #1f6f35 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
        }

        .details-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .detail-row {
            display: flex;
            align-items: baseline;
            font-size: 14px;
            padding: 8px 0;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            font-weight: 700;
            color: #2d3748;
            width: 140px;
            flex-shrink: 0;
        }

        .detail-value {
            color: #718096;
            font-weight: 500;
        }

        /* Badges */
        .badge {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: capitalize;
            color: #fff;
            box-shadow: 0 4px 12px rgba(19, 180, 126, 0.3);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 0 15px;
            }

            .header-content {
                flex-direction: column;
                gap: 15px;
                align-items: flex-start;
            }

            .nav-menu {
                width: 100%;
                justify-content: space-between;
                gap: 10px;
                flex-wrap: wrap;
            }

            .nav-item {
                font-size: 13px;
                padding: 6px 12px;
            }

            .page-title {
                font-size: 24px;
            }

            .page-title-content {
                flex-direction: column;
                gap: 15px;
                align-items: flex-start;
            }

            .booking-card {
                flex-direction: column;
            }

            .card-icon-col {
                width: 100%;
                height: 80px;
            }

            .card-details-col {
                padding: 20px;
            }

            .parking-name {
                font-size: 18px;
            }

            .detail-row {
                flex-direction: column;
                margin-bottom: 5px;
                gap: 4px;
            }

            .detail-label {
                width: 100%;
                margin-bottom: 2px;
            }
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header>
        <div class="container header-content">
            <div class="logo-area">
                <a href="index.html" class="logo-text">PARKCHUNG</a>
                <span class="logo-slogan">Seamless Smart Parking, Safe & Easy</span>
            </div>
            <nav class="nav-menu">
                <a href="create-spot.html" class="nav-item">Become a Host</a>
                <a href="#" class="nav-item active">My Bookings</a>
                <a href="#" class="nav-item" id="user-welcome">Welcome</a>
                <a href="login.html" class="nav-item" id="logout-link">Logout</a>
            </nav>
        </div>
    </header>

    <!-- Page Title Section -->
    <div class="page-title-section">
        <div class="container page-title-content">
            <h1 class="page-title">My Bookings</h1>
            <a href="index.html" class="back-link">
                <span>&#8592;</span> Back to Home
            </a>
        </div>
    </div>

    <!-- Main Content -->
    <div class="container">
        <div class="booking-list">
            <!-- Bookings will be loaded dynamically by JavaScript -->
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/my-bookings.js"></script>
</body>

</html>
