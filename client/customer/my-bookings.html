<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Vé của tôi | Parkchung</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <style>
        /* Base Reset & Variables */
        :root {
            --primary: #2DC989;
            --primary-dark: #1f9e68;
            --primary-light: rgba(45, 201, 137, 0.15);
            --dark-bg: #11222c;
            --light-bg: #f4f5f8;
            --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            --transition: all 0.3s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Montserrat", "Inter", sans-serif;
            background-color: var(--light-bg);
            color: #2d3748;
            min-height: 100vh;
            line-height: 1.5;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        button {
            font-family: inherit;
            border: none;
            outline: none;
            cursor: pointer;
        }

        /* ======= HEADER ======= */
        header {
            background-color: var(--dark-bg);
            padding: 12px 0;
            color: #ffffff;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-container {
            max-width: 1440px;
            margin: 0 auto;
            padding: 0 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-logo img {
            height: 32px;
        }

        .header-logo-text {
            display: flex;
            flex-direction: column;
        }

        .header-brand {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #ffffff;
        }

        .header-tagline {
            font-size: 10px;
            color: #8892b0;
            font-weight: 500;
        }

        .header-nav {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .become-host-link {
            font-size: 14px;
            font-weight: 600;
            color: #e2e8f0;
            transition: var(--transition);
        }

        .become-host-link:hover {
            color: var(--primary);
        }

        .my-account-btn {
            background-color: var(--primary);
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
            padding: 8px 18px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 10px rgba(45, 201, 137, 0.3);
            transition: var(--transition);
        }

        .my-account-btn:hover {
            background-color: var(--primary-dark);
            transform: translateY(-1px);
        }

        .logout-link {
            font-size: 14px;
            font-weight: 600;
            color: #cbd5e0;
            transition: var(--transition);
        }

        .logout-link:hover {
            color: #fc8181;
        }

        /* Language Switcher */
        .lang-switcher {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 12px;
            transition: var(--transition);
        }

        .lang-switcher:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .lang-flag {
            width: 20px;
            height: 14px;
            object-fit: cover;
            border-radius: 2px;
        }

        .lang-arrow {
            font-size: 8px;
            color: #a0aec0;
        }

        /* ======= DASHBOARD LAYOUT ======= */
        .dashboard-container {
            max-width: 1440px;
            margin: 40px auto;
            padding: 0 40px;
            display: flex;
            gap: 40px;
        }

        /* Left Sidebar */
        aside.sidebar-v3 {
            width: 260px;
            background: #ffffff;
            border-radius: 16px;
            padding: 24px;
            box-shadow: var(--card-shadow);
            align-self: flex-start;
        }

        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 18px;
            font-size: 15px;
            font-weight: 600;
            color: #718096;
            border-radius: 12px;
            margin-bottom: 8px;
            transition: var(--transition);
        }

        .sidebar-item:last-child {
            margin-bottom: 0;
        }

        .sidebar-item i {
            font-size: 18px;
        }

        .sidebar-item:hover {
            color: var(--primary);
            background: var(--primary-light);
        }

        .sidebar-item.active {
            background: var(--primary);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(45, 201, 137, 0.25);
        }

        /* Right Content Panel */
        main.main-content-v3 {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        /* Content Title & Tabs Header */
        .content-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .page-title {
            font-size: 28px;
            font-weight: 800;
            color: #1a202c;
        }

        .page-title::after {
            content: '.';
            color: var(--primary);
        }

        .tabs-container {
            display: flex;
            background: #edf2f7;
            border-radius: 24px;
            padding: 4px;
            gap: 4px;
        }

        .tab-btn {
            padding: 8px 24px;
            font-size: 14px;
            font-weight: 700;
            color: #718096;
            background: transparent;
            border-radius: 20px;
            transition: var(--transition);
        }

        .tab-btn:hover {
            color: #2d3748;
        }

        .tab-btn.active {
            background: #ffffff;
            color: var(--primary);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        /* ======= BOOKINGS LIST ======= */
        .booking-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding-bottom: 40px;
        }

        /* Loading / Empty / Error State */
        .status-container {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: var(--card-shadow);
            padding: 60px 40px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .status-icon {
            font-size: 48px;
            color: #cbd5e0;
            margin-bottom: 20px;
        }

        .status-title {
            font-size: 20px;
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 10px;
        }

        .status-desc {
            font-size: 14.5px;
            color: #718096;
            margin-bottom: 24px;
            max-width: 400px;
        }

        .status-btn {
            background-color: var(--primary);
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
            padding: 12px 28px;
            border-radius: 30px;
            box-shadow: 0 4px 10px rgba(45, 201, 137, 0.2);
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .status-btn:hover {
            background-color: var(--primary-dark);
            transform: translateY(-2px);
        }

        /* ======= TICKET CARDS SYSTEM ======= */
        .ticket-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: var(--card-shadow);
            display: flex;
            overflow: hidden;
            transition: var(--transition);
            border: 1px solid #e2e8f0;
            box-sizing: border-box;
            cursor: pointer;
        }

        .ticket-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }

        /* Left Icon Column */
        .ticket-icon-col {
            width: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            position: relative;
        }

        .ticket-icon-circle {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            border: 2px solid #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 24px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        /* Details Column */
        .ticket-details-col {
            flex-grow: 1;
            padding: 24px 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .ticket-top-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .ticket-code {
            font-size: 16px;
            font-weight: 800;
            color: #1a202c;
        }

        .ticket-badge {
            font-size: 10.5px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .ticket-info-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13.5px;
            font-weight: 600;
            color: #4a5568;
            margin-bottom: 6px;
        }

        .ticket-info-item:last-child {
            margin-bottom: 0;
        }

        .ticket-info-item i {
            font-size: 14px;
            width: 16px;
            color: #a0aec0;
        }

        /* Right Actions Column */
        .ticket-actions-col {
            width: 220px;
            padding: 24px 30px;
            border-left: 1px dashed #e2e8f0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-end;
            flex-shrink: 0;
        }

        .ticket-price-label {
            font-size: 10px;
            font-weight: 700;
            color: #a0aec0;
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        .ticket-price-value {
            font-size: 18px;
            font-weight: 800;
            color: #2d3748;
            margin-bottom: 16px;
        }

        .ticket-btn {
            width: 100%;
            padding: 10px 16px;
            font-size: 13px;
            font-weight: 700;
            border-radius: 8px;
            text-align: center;
            transition: var(--transition);
        }

        /* ======= CARD STATE STYLES (MATCHING FIGMA) ======= */
        
        /* 1. GREEN CARD (ĐANG DÙNG) */
        .ticket-card.state-active {
            background: linear-gradient(135deg, #2ec988 0%, #1f9e68 100%);
            border-color: #2ec988;
            color: #ffffff;
        }
        .ticket-card.state-active .ticket-icon-col {
            background: rgba(255, 255, 255, 0.1);
        }
        .ticket-card.state-active .ticket-icon-circle {
            background: rgba(255, 255, 255, 0.2);
        }
        .ticket-card.state-active .ticket-code {
            color: #ffffff;
        }
        .ticket-card.state-active .ticket-badge {
            background: #ffffff;
            color: #1f9e68;
        }
        .ticket-card.state-active .ticket-info-item {
            color: rgba(255, 255, 255, 0.9);
        }
        .ticket-card.state-active .ticket-info-item i {
            color: rgba(255, 255, 255, 0.7);
        }
        .ticket-card.state-active .ticket-actions-col {
            border-left-color: rgba(255, 255, 255, 0.2);
        }
        .ticket-card.state-active .ticket-price-label {
            color: rgba(255, 255, 255, 0.7);
        }
        .ticket-card.state-active .ticket-price-value {
            color: #ffffff;
        }
        .ticket-card.state-active .ticket-btn {
            background: #ffffff;
            color: #1f9e68;
        }
        .ticket-card.state-active .ticket-btn:hover {
            background: #f7fafc;
            transform: scale(1.02);
        }

        /* 2. ORANGE CARD (SẮP HẾT GIỜ ĐỖ) */
        .ticket-card.state-warning {
            background: linear-gradient(135deg, #f26419 0%, #d84b05 100%);
            border-color: #f26419;
            color: #ffffff;
        }
        .ticket-card.state-warning .ticket-icon-col {
            background: rgba(255, 255, 255, 0.1);
        }
        .ticket-card.state-warning .ticket-icon-circle {
            background: rgba(255, 255, 255, 0.2);
        }
        .ticket-card.state-warning .ticket-code {
            color: #ffffff;
        }
        .ticket-card.state-warning .ticket-badge {
            background: #ffffff;
            color: #f26419;
        }
        .ticket-card.state-warning .ticket-info-item {
            color: rgba(255, 255, 255, 0.9);
        }
        .ticket-card.state-warning .ticket-info-item i {
            color: rgba(255, 255, 255, 0.7);
        }
        .ticket-card.state-warning .ticket-actions-col {
            border-left-color: rgba(255, 255, 255, 0.2);
        }
        .ticket-card.state-warning .ticket-price-label {
            color: rgba(255, 255, 255, 0.7);
        }
        .ticket-card.state-warning .ticket-price-value {
            color: #ffffff;
        }
        .ticket-card.state-warning .ticket-btn {
            background: #ffffff;
            color: #f26419;
        }
        .ticket-card.state-warning .ticket-btn:hover {
            background: #f7fafc;
            transform: scale(1.02);
        }

        /* 3. RED BORDER CARD (QUÁ GIỜ ĐỖ) */
        .ticket-card.state-expired {
            border: 2px solid #e53e3e;
            box-shadow: 0 4px 20px rgba(229, 62, 62, 0.1);
        }
        .ticket-card.state-expired .ticket-icon-col {
            background: #fff5f5;
        }
        .ticket-card.state-expired .ticket-icon-circle {
            background: #e53e3e;
            border-color: #e53e3e;
        }
        .ticket-card.state-expired .ticket-badge {
            background: #fed7d7;
            color: #e53e3e;
        }
        .ticket-card.state-expired .ticket-price-value {
            color: #e53e3e;
        }
        .ticket-card.state-expired .ticket-btn {
            background: #e53e3e;
            color: #ffffff;
        }
        .ticket-card.state-expired .ticket-btn:hover {
            background: #c53030;
        }

        /* 4. BLUE CARD (CHỜ THANH TOÁN) */
        .ticket-card.state-pending-pay {
            border: 2px solid #3182ce;
        }
        .ticket-card.state-pending-pay .ticket-icon-col {
            background: #ebf8ff;
        }
        .ticket-card.state-pending-pay .ticket-icon-circle {
            background: #3182ce;
            border-color: #3182ce;
        }
        .ticket-card.state-pending-pay .ticket-badge {
            background: #bee3f8;
            color: #3182ce;
        }
        .ticket-card.state-pending-pay .ticket-btn {
            background: #3182ce;
            color: #ffffff;
        }
        .ticket-card.state-pending-pay .ticket-btn:hover {
            background: #2b6cb0;
        }

        /* 5. YELLOW BORDER CARD (SẮP ĐẾN HẠN) */
        .ticket-card.state-upcoming-near {
            border: 2px solid #dd6b20;
        }
        .ticket-card.state-upcoming-near .ticket-icon-col {
            background: #fffaf0;
        }
        .ticket-card.state-upcoming-near .ticket-icon-circle {
            background: #dd6b20;
            border-color: #dd6b20;
        }
        .ticket-card.state-upcoming-near .ticket-badge {
            background: #feebc8;
            color: #dd6b20;
        }
        .ticket-card.state-upcoming-near .ticket-btn {
            background: #dd6b20;
            color: #ffffff;
        }
        .ticket-card.state-upcoming-near .ticket-btn:hover {
            background: #c05621;
        }

        /* 6. BLUE CARD (VÉ CHƯA DÙNG) */
        .ticket-card.state-upcoming-far {
            border: 2px solid #319795;
        }
        .ticket-card.state-upcoming-far .ticket-icon-col {
            background: #e6fffa;
        }
        .ticket-card.state-upcoming-far .ticket-icon-circle {
            background: #319795;
            border-color: #319795;
        }
        .ticket-card.state-upcoming-far .ticket-badge {
            background: #e6fffa;
            color: #319795;
        }
        .ticket-card.state-upcoming-far .ticket-btn {
            background: #319795;
            color: #ffffff;
        }
        .ticket-card.state-upcoming-far .ticket-btn:hover {
            background: #2c7a7b;
        }

        /* 7. GRAY CARD (VÉ QUÁ HẠN / ĐÃ HỦY) */
        .ticket-card.state-archived {
            background: #f7fafc;
            border-color: #e2e8f0;
        }
        .ticket-card.state-archived .ticket-icon-col {
            background: #edf2f7;
        }
        .ticket-card.state-archived .ticket-icon-circle {
            background: #a0aec0;
            border-color: #a0aec0;
        }
        .ticket-card.state-archived .ticket-badge {
            background: #e2e8f0;
            color: #4a5568;
        }
        .ticket-card.state-archived .ticket-price-value {
            color: #718096;
        }
        .ticket-card.state-archived .ticket-btn {
            background: #ffffff;
            border: 1px solid #cbd5e0;
            color: #4a5568;
        }
        .ticket-card.state-archived .ticket-btn:hover {
            background: #edf2f7;
        }

        /* 8. WHITE CARD WITH GREEN BORDER (ĐÃ DÙNG) */
        .ticket-card.state-completed {
            border: 2px solid #38a169;
        }
        .ticket-card.state-completed .ticket-icon-col {
            background: #f0fff4;
        }
        .ticket-card.state-completed .ticket-icon-circle {
            background: #38a169;
            border-color: #38a169;
        }
        .ticket-card.state-completed .ticket-badge {
            background: #c6f6d5;
            color: #38a169;
        }
        .ticket-card.state-completed .ticket-btn {
            background: #ffffff;
            border: 1px solid #38a169;
            color: #38a169;
        }
        .ticket-card.state-completed .ticket-btn:hover {
            background: #f0fff4;
        }

        /* ======= QR CODE MODAL ======= */
        .qr-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .qr-modal-overlay.active {
            display: flex;
        }

        .qr-modal {
            background: #ffffff;
            border-radius: 20px;
            padding: 30px;
            width: 90%;
            max-width: 380px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            text-align: center;
            position: relative;
            animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes popIn {
            from {
                transform: scale(0.8);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .qr-modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 20px;
            color: #a0aec0;
            cursor: pointer;
            transition: var(--transition);
        }

        .qr-modal-close:hover {
            color: #4a5568;
        }

        .qr-modal-title {
            font-size: 18px;
            font-weight: 800;
            color: #1a202c;
            margin-bottom: 20px;
        }

        .qr-code-box {
            background: #f7fafc;
            border-radius: 12px;
            padding: 20px;
            display: inline-block;
            margin-bottom: 20px;
            border: 1px dashed #e2e8f0;
        }

        .qr-code-box svg {
            width: 160px;
            height: 160px;
        }

        .qr-modal-desc {
            font-size: 13.5px;
            color: #718096;
            line-height: 1.5;
            font-weight: 500;
        }

        /* ======= RESPONSIVE ======= */
        @media (max-width: 1024px) {
            .dashboard-container {
                flex-direction: column;
                padding: 0 20px;
                margin: 20px auto;
            }

            aside.sidebar-v3 {
                width: 100%;
                display: flex;
                flex-direction: row;
                justify-content: space-around;
                padding: 12px;
            }

            .sidebar-item {
                margin-bottom: 0;
            }
        }

        @media (max-width: 768px) {
            .header-container {
                padding: 0 20px;
            }

            .content-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .tabs-container {
                width: 100%;
                justify-content: space-between;
            }

            .tab-btn {
                flex: 1;
                text-align: center;
                padding: 8px 12px;
            }

            .ticket-card {
                flex-direction: column;
            }

            .ticket-icon-col {
                width: 100%;
                height: 80px;
            }

            .ticket-actions-col {
                width: 100%;
                border-left: none;
                border-top: 1px dashed #e2e8f0;
                align-items: stretch;
            }

            .ticket-price-value {
                text-align: right;
            }
        }
    </style>
</head>

<body>

    <!-- Header Section -->
    <header>
        <div class="header-container">
            <div class="header-logo">
                <a href="index.html">
                    <img src="/assets/logo/logo.svg" alt="ParkChung" />
                </a>
                <div class="header-logo-text">
                    <span class="header-brand">PARKCHUNG</span>
                    <span class="header-tagline" data-i18n="logo_slogan">Seamless Smart Parking, Safe & Easy</span>
                </div>
            </div>
            <nav class="header-nav" id="customer-nav">
                <!-- Loaded dynamically by JS -->
            </nav>
        </div>
    </header>

    <!-- Dashboard Main Layout -->
    <div class="dashboard-container">
        <!-- Left Sidebar Navigation -->
        <aside class="sidebar-v3">
            <a href="my-bookings.html" class="sidebar-item active">
                <i class="fas fa-home"></i> <span data-i18n="nav_home">Trang chủ</span>
            </a>
            <a href="#" class="sidebar-item" id="sidebar-help">
                <i class="fas fa-question-circle"></i> <span data-i18n="nav_help">Hỗ trợ & trợ giúp</span>
            </a>
            <a href="my-profile.html" class="sidebar-item">
                <i class="fas fa-user"></i> <span data-i18n="my_profile">Tài khoản</span>
            </a>
        </aside>

        <!-- Right Main Panel -->
        <main class="main-content-v3">
            <!-- Header section of content -->
            <div class="content-header">
                <h1 class="page-title" data-i18n="my_bookings">Quản lý Vé của tôi</h1>
                <div class="tabs-container">
                    <button class="tab-btn active" id="tab-active" data-tab="active">Đang dùng</button>
                    <button class="tab-btn" id="tab-upcoming" data-tab="upcoming">Sắp diễn ra</button>
                    <button class="tab-btn" id="tab-past" data-tab="past">Đã dùng</button>
                </div>
            </div>

            <!-- Dynamic Tickets Container -->
            <div class="booking-list">
                <!-- Rendered dynamically by JS -->
            </div>
        </main>
    </div>

    <!-- QR Code Modal (Popup) -->
    <div class="qr-modal-overlay" id="qr-modal">
        <div class="qr-modal">
            <span class="qr-modal-close" id="qr-close-btn">&times;</span>
            <h3 class="qr-modal-title">Mã QR Vé của bạn</h3>
            <div class="qr-code-box">
                <!-- QR Code mock using a clean vector path SVG -->
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
                    <path fill="#11222c" d="M0 0h30v10H10v20H0V0zm10 10h10v10H10V10zm60-10h30v30h-10V10H70V0zm10 10h10v10H80V10zM0 70h10v20h20v10H0V70zm10 20h10v-10H10v10zm60 10h30V70H90v20H70v10zm10-20h10v10H80v-10zM35 15h10v10H35v-10zm15 0h10v10H50v-10zm0 15h10v10H50v-10zm15 15h10v10H65v-10zm-30 0h10v10H35v-10zm-15 15h10v10H20v-10zm30 0h10v10H50v-10zm15 0h10v10H65v-10zm-30 15h10v10H35v-10zm15 0h10v10H50v-10z" />
                    <rect x="40" y="40" width="20" height="20" fill="#2DC989" rx="2" />

        </div>
    </div>
