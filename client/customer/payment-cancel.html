<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Payment Cancelled - ParkChung</title>
    <link rel="icon" type="image/png" href="/assets/logo/favicon.png" />
    <link rel="stylesheet" href="css/styles.css" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>
</head>
<body>
    <header>
        <div class="logo">
            <a href="index.html" style="display: flex; align-items: center; text-decoration: none; color: inherit;">
                <img src="/assets/logo/logo.svg" alt="Parkchung Logo" />
                <div>
                    <h1>PARKCHUNG</h1>
                    <p class="tagline">Save time. Save money. Save Earth</p>
                </div>
            </a>
        </div>
    </header>

    <main class="bookings-main">
        <div class="bookings-header">
            <h2>Payment Cancelled</h2>
            <a href="index.html" class="nav-button home-button">← Back to Home</a>
        </div>
        <div class="booking-card">
            <div class="booking-card__icon">
                <i class="fas fa-exclamation-triangle"></i>
            </div>
            <div class="booking-card__details">
                <h3 id="cancel-message-title">Processing your cancellation...</h3>
                <p id="cancel-message-body">Please wait while we release your booking.</p>
                <div class="payment-actions" style="margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap;">
                    <button id="retry-booking" class="submit-button" style="flex: 1; min-width: 180px;">Book another spot</button>
                    <button id="view-bookings-cancel" class="submit-button" style="flex: 1; min-width: 180px; background-color: #34495e;">View My Bookings</button>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js" defer></script>
    <script src="js/config.js"></script>
    <script src="js/payment-cancel.js" type="module"></script>
</body>
</html>
