<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Payment Result - ParkChung</title>
    <link rel="icon" type="image/png" href="/assets/logo/favicon.png" />
    <link rel="stylesheet" href="css/styles.css" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <style>
        /* Payment Result Page Styles */
        body {
            background: linear-gradient(135deg, #13b47e 0%, #1f6f35 100%);
            min-height: 100vh;
        }

        header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .bookings-main {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }

        .bookings-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .bookings-header h2 {
            color: #ffffff;
            font-size: 2.5em;
            font-weight: 700;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
        }

        .home-button {
            display: inline-block;
            padding: 12px 28px;
            background: rgba(255, 255, 255, 0.2);
            color: #ffffff;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .home-button:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.5);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .booking-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 50px 40px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .booking-card__icon {
            width: 100px;
            height: 100px;
            margin: 0 auto 30px;
            background: linear-gradient(135deg, #13b47e 0%, #1f6f35 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(19, 180, 126, 0.4);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
                box-shadow: 0 10px 30px rgba(19, 180, 126, 0.4);
            }

            50% {
                transform: scale(1.05);
                box-shadow: 0 15px 40px rgba(19, 180, 126, 0.6);
            }
        }

        .booking-card__icon i {
            font-size: 48px;
            color: #ffffff;
        }

        .booking-card__details h3 {
            font-size: 2em;
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 15px;
        }

        .booking-card__details p {
            font-size: 1.1em;
            color: #718096;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        #payment-booking-summary {
            background: linear-gradient(135deg, #f6f8fb 0%, #e9ecef 100%);
            border-radius: 16px;
            padding: 25px;
            margin: 25px 0;
            border-left: 4px solid #13b47e;
            text-align: left;
        }

        .payment-actions {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 30px;
        }

        .submit-button {
            flex: 1;
            min-width: 180px;
            padding: 16px 32px;
            font-size: 1.05em;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            font-family: 'Montserrat', sans-serif;
        }

        #refresh-status {
            background: linear-gradient(135deg, #13b47e 0%, #1f6f35 100%);
            color: #ffffff;
        }

        #refresh-status:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(19, 180, 126, 0.4);
        }

        #view-bookings {
            background: linear-gradient(135deg, #2d3748 0%, #4a5568 100%);
            color: #ffffff;
        }

        #view-bookings:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(45, 55, 72, 0.4);
        }

        /* Success state */
        .payment-success .booking-card__icon {
            background: linear-gradient(135deg, #00b894 0%, #00cec9 100%);
            box-shadow: 0 10px 30px rgba(0, 184, 148, 0.4);
        }

        .payment-success #payment-status-heading {
            color: #00b894;
        }

        /* Error state */
        .payment-error .booking-card__icon {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            box-shadow: 0 10px 30px rgba(231, 76, 60, 0.4);
        }

        .payment-error #payment-status-heading {
            color: #e74c3c;
        }

        /* Loading animation */
        .loading .booking-card__icon i {
            animation: spin 1.5s linear infinite;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .bookings-main {
                padding: 15px;
                margin: 20px auto;
            }

            .bookings-header h2 {
                font-size: 2em;
            }

            .booking-card {
                padding: 35px 25px;
            }

            .booking-card__icon {
                width: 80px;
                height: 80px;
            }

            .booking-card__icon i {
                font-size: 36px;
            }

            .booking-card__details h3 {
                font-size: 1.6em;
            }

            .payment-actions {
                flex-direction: column;
            }

            .submit-button {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="logo">
            <a href="index.html" style="display: flex; align-items: center; text-decoration: none; color: inherit;">
                <img src="/assets/logo/logo.svg" alt="Parkchung Logo" />
                <div>
                    <h1>PARKCHUNG</h1>
                    <p class="tagline">Save time. Save money. Save Earth</p>
                </div>
            </a>
        </div>
    </header>

    <main class="bookings-main">
        <div class="bookings-header">
            <h2>Payment Status</h2>
            <a href="index.html" class="nav-button home-button">← Back to Home</a>
        </div>
        <div class="booking-card loading" id="payment-result-card">
            <div class="booking-card__icon">
                <i class="fas fa-receipt"></i>
            </div>
            <div class="booking-card__details">
                <h3 id="payment-status-heading">Checking your payment...</h3>
                <p id="payment-status-description">We are verifying the latest updates from PayPal.</p>
                <div id="payment-booking-summary"></div>
                <div class="payment-actions">
                    <button id="refresh-status" class="submit-button">Refresh Status</button>
                    <button id="view-bookings" class="submit-button">Go to My Bookings</button>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js" defer></script>
    <script src="js/config.js"></script>
    <script src="js/payment-result.js" type="module"></script>
</body>

</html>
