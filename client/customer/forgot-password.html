<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu | ParkChung - Smart Parking Here</title>
    <meta name="description" content="Đặt lại mật khẩu tài khoản ParkChung của bạn.">
    <link rel="icon" type="image/png" href="/assets/logo/favicon.png" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat+Alternates:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            box-sizing: border-box; margin: 0; padding: 0;
        }
        :root {
            --green-primary: #2DC989;
            --green-dark: #0FB474;
            --green-light: #60D4A1;
            --green-muted: #F0FAF5;
            --text-dark: #111827;
            --text-mid: #4B5563;
            --text-light: #6B7280;
            --text-placeholder: #9CA3AF;
            --border: #E5E7EB;
            --error: #EF4444;
            --white: #FFFFFF;
        }
        html, body { height: 100%; font-family: 'Inter', sans-serif; background: var(--white); }
        .auth-layout { display: flex; min-height: 100vh; }
        .auth-left { flex: 0 0 55%; display: flex; flex-direction: column; padding: 36px 72px; }
        .auth-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; }
        .auth-logo img { width: 47px; height: 47px; object-fit: contain; }
        .auth-logo h1 { font-family: 'Montserrat Alternates', sans-serif; font-size: 21px; font-weight: 700; color: var(--text-dark); letter-spacing: 1px; }
        .auth-logo p { font-size: 11px; color: var(--text-light); }
        .auth-form-wrapper { flex: 1; display: flex; align-items: center; justify-content: center; }
        .auth-form-inner { width: 100%; max-width: 504px; }
        .auth-heading { font-size: 40px; font-weight: 700; color: var(--text-dark); margin-bottom: 12px; line-height: 1.1; }
        .auth-subtext { font-size: 18px; color: var(--text-mid); line-height: 1.6; margin-bottom: 28px; }
        .form-input {
            width: 100%; height: 52px; padding: 0 14px;
            border: 1.5px solid var(--border); border-radius: 7px;
            background: var(--white); font-family: 'Inter', sans-serif;
            font-size: 15px; color: var(--text-dark); outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-input::placeholder { color: var(--text-placeholder); }
        .form-input:focus { border-color: var(--green-primary); box-shadow: 0 0 0 3px rgba(45,201,137,0.15); }
        .auth-submit-btn {
            width: 100%; height: 55px; background: var(--green-primary); color: var(--white);
            border: none; border-radius: 7px; font-family: 'Inter', sans-serif;
            font-size: 16px; font-weight: 700; cursor: pointer; transition: background 0.2s;
            margin-top: 18px;
        }
        .auth-submit-btn:hover { background: var(--green-dark); }
        .auth-submit-btn:disabled { opacity: 0.7; cursor: not-allowed; }
        .back-link {
            display: inline-block; margin-top: 18px;
            font-family: 'Montserrat Alternates', sans-serif; font-size: 14px; font-weight: 700;
            color: var(--green-primary); text-decoration: none;
        }
        .back-link:hover { text-decoration: underline; }

        /* Success state */
        .success-box {
            background: var(--green-muted); border: 1.5px solid var(--green-primary);
            border-radius: 7px; padding: 16px 18px; display: none; margin-bottom: 24px;
        }
        .success-box.visible { display: flex; align-items: flex-start; gap: 12px; }
        .success-box-icon { font-size: 22px; flex-shrink: 0; }
        .success-box-text { font-size: 14px; color: var(--text-dark); line-height: 1.6; }
        .success-box-text strong { display: block; margin-bottom: 4px; color: var(--green-dark); font-weight: 700; }

        .form-error-banner {
            background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.3);
            color: var(--error); border-radius: 7px; padding: 12px 14px;
            font-size: 14px; margin-bottom: 16px; display: none;
        }
        .form-error-banner.visible { display: block; }

        /* Right brand */
        .auth-right { flex: 0 0 45%; background: var(--green-primary); display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
        .auth-right-content { position: relative; z-index: 2; text-align: center; padding: 40px; }
        .auth-brand-watermark { font-family: 'Montserrat Alternates', sans-serif; font-size: 52px; font-weight: 700; color: var(--green-light); letter-spacing: 4px; margin-bottom: 40px; opacity: 0.8; }
        .auth-parking-badge { width: 200px; height: 200px; background: rgba(255,255,255,0.15); border-radius: 32px; display: flex; align-items: center; justify-content: center; animation: float 4s ease-in-out infinite; box-shadow: 0 20px 60px rgba(0,0,0,0.15); margin: 0 auto; }
        .auth-parking-badge span { font-family: 'Montserrat Alternates', sans-serif; font-size: 100px; font-weight: 700; color: rgba(255,255,255,0.9); line-height: 1; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        .auth-right::before { content: ''; position: absolute; width: 400px; height: 400px; border-radius: 50%; background: rgba(255,255,255,0.08); top: -100px; right: -100px; }
        .auth-right::after { content: ''; position: absolute; width: 300px; height: 300px; border-radius: 50%; background: rgba(255,255,255,0.06); bottom: -80px; left: -80px; }

        @media (max-width: 900px) {
            .auth-right { display: none; }
            .auth-left { flex: 1; padding: 24px 32px; }
            .auth-heading { font-size: 30px; }
        }
    </style>
</head>

<body>
    <div class="auth-layout">
        <div class="auth-left">
            <a href="index.html" class="auth-logo">
                <img src="/assets/logo/logo.svg" alt="ParkChung Logo">
                <div>
                    <h1>PARKCHUNG</h1>
                    <p>Smart Parking Here</p>
                </div>
            </a>

            <div class="auth-form-wrapper">
                <div class="auth-form-inner">
                    <h2 class="auth-heading">Đặt lại mật khẩu.</h2>
                    <p class="auth-subtext">Vui lòng nhập địa chỉ email của bạn bên dưới, chúng tôi sẽ gửi cho bạn một liên kết để đặt lại mật khẩu.</p>

                    <!-- Success box -->
                    <div class="success-box" id="success-box">
                        <span class="success-box-icon">✓</span>
                        <div class="success-box-text">
                            <strong>Email đã được gửi!</strong>
                            Vui lòng kiểm tra hộp thư của bạn và làm theo hướng dẫn để đặt lại mật khẩu.
                        </div>
                    </div>

                    <!-- Error banner -->
                    <div id="forgot-error" class="form-error-banner"></div>

                    <form id="forgot-form">
                        <input type="email" id="forgot-email" class="form-input" placeholder="Địa chỉ Email"
                            autocomplete="email" required>
                        <button type="submit" class="auth-submit-btn" id="forgot-submit-btn">
                            Gửi liên kết đặt lại mật khẩu
                        </button>
                    </form>

                    <a href="login.html" class="back-link">← Quay lại đăng nhập</a>
                </div>
            </div>
        </div>

        <div class="auth-right">
            <div class="auth-right-content">
                <div class="auth-brand-watermark">PARKCHUNG</div>
                <div class="auth-parking-badge"><span>P</span></div>
            </div>
        </div>
    </div>

    <script src="js/config.js?v=4"></script>
    <script>
        const form = document.getElementById('forgot-form');
        const emailInput = document.getElementById('forgot-email');
        const submitBtn = document.getElementById('forgot-submit-btn');
        const errorBanner = document.getElementById('forgot-error');
        const successBox = document.getElementById('success-box');

        form?.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorBanner.classList.remove('visible');

            submitBtn.disabled = true;
            submitBtn.textContent = 'Đang gửi...';

            const email = emailInput.value.trim();
            try {
                const res = await fetch(`${API_URL}/auth/forgot-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                // Always show success to prevent email enumeration
                form.style.display = 'none';
                successBox.classList.add('visible');
            } catch (err) {
                // Even on network error, show success (security best practice)
                form.style.display = 'none';
                successBox.classList.add('visible');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Gửi liên kết đặt lại mật khẩu';
            }
        });
    </script>
</body>

</html>
